# Load this file in tools/lights_preview_gui/app.py.
# It demonstrates a shared LED layout with several separately previewable animations.

layout:
  width: 1.0
  height: 1.0
  leds:
    - { id: "0", index: 0, x: 0.5000, y: 0.0800, radius: 0.025, label: "0" }
    - { id: "1", index: 1, x: 0.6607, y: 0.1136, radius: 0.025, label: "1" }
    - { id: "2", index: 2, x: 0.8000, y: 0.2000, radius: 0.025, label: "2" }
    - { id: "3", index: 3, x: 0.8864, y: 0.3393, radius: 0.025, label: "3" }
    - { id: "4", index: 4, x: 0.9200, y: 0.5000, radius: 0.025, label: "4" }
    - { id: "5", index: 5, x: 0.8864, y: 0.6607, radius: 0.025, label: "5" }
    - { id: "6", index: 6, x: 0.8000, y: 0.8000, radius: 0.025, label: "6" }
    - { id: "7", index: 7, x: 0.6607, y: 0.8864, radius: 0.025, label: "7" }
    - { id: "8", index: 8, x: 0.5000, y: 0.9200, radius: 0.025, label: "8" }
    - { id: "9", index: 9, x: 0.3393, y: 0.8864, radius: 0.025, label: "9" }
