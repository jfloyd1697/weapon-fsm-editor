          "12": { color: "#0070b0", intensity: 0.45 }
          "13": { color: "#0070b0", intensity: 0.45 }
          "14": { color: "#0070b0", intensity: 0.45 }
          "15": { color: "#0070b0", intensity: 0.45 }

  charge_glow:
    frame_duration_ms: 80
    frames:
      - leds: *dim_blue
      - leds:
          "0":  "#00c8ff"
          "1":  "#00c8ff"
          "2":  { color: "#00c8ff", intensity: 0.65 }
          "15": { color: "#00c8ff", intensity: 0.65 }
