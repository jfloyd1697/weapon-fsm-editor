animations:
  idle_glow:
    frame_duration_ms: 160
    frames:
      - leds: &dim_blue
          "0":  { color: "#003050", intensity: 0.20 }
          "1":  { color: "#003050", intensity: 0.20 }
          "2":  { color: "#003050", intensity: 0.20 }
          "3":  { color: "#003050", intensity: 0.20 }
          "4":  { color: "#003050", intensity: 0.20 }
          "5":  { color: "#003050", intensity: 0.20 }
          "6":  { color: "#003050", intensity: 0.20 }
          "7":  { color: "#003050", intensity: 0.20 }
          "8":  { color: "#003050", intensity: 0.20 }
          "9":  { color: "#003050", intensity: 0.20 }
          "10": { color: "#003050", intensity: 0.20 }
          "11": { color: "#003050", intensity: 0.20 }
          "12": { color: "#003050", intensity: 0.20 }
          "13": { color: "#003050", intensity: 0.20 }
          "14": { color: "#003050", intensity: 0.20 }
          "15": { color: "#003050", intensity: 0.20 }
      - leds:
          "0":  { color: "#0070b0", intensity: 0.45 }
          "1":  { color: "#0070b0", intensity: 0.45 }
          "2":  { color: "#0070b0", intensity: 0.45 }
          "3":  { color: "#0070b0", intensity: 0.45 }
          "4":  { color: "#0070b0", intensity: 0.45 }
          "5":  { color: "#0070b0", intensity: 0.45 }
