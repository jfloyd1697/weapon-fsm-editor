layout:
  path: layouts/cpx_ring.json

animation:
  width: 1.0
  height: 1.0
  frame_duration_ms: 33
  duration_ms: 900
  layers:
    - type: radial_pulse
      start_ms: 0
      duration_ms: 600
      center: [0.5, 0.5]
      color: "#00aaff"
      intensity: 1.0
      radius_from: 0.0
      radius_to: 0.65
      width: 0.18

    - type: solid
      start_ms: 600
      duration_ms: 300
      color: "#ffffff"
      intensity: 0.35
