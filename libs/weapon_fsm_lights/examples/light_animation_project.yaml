layout:
  path: layouts/cpx_ring_61.json

animations:
  idle_glow:
    frame_duration_ms: 33
    duration_ms: 1200
    mode: loop
    layers:
      - name: base blue
        type: solid
        start_ms: 0
        duration_ms: 1200
        color: "#003366"
        intensity: 0.20
      - name: breathing pulse
        type: radial_pulse
        start_ms: 0
        duration_ms: 1200
        color: "#00aaff"
        intensity: 0.75
        center: [0.5, 0.5]
        radius_from: 0.0
        radius_to: 0.65
        width: 0.30

  charge_glow:
    frame_duration_ms: 33
    duration_ms: 1000
    mode: once
    layers:
      - name: charge ring
        type: radial_pulse
        start_ms: 0
        duration_ms: 700
        color: "#00ccff"
        intensity: 1.0
        center: [0.5, 0.5]
        radius_from: 0.0
        radius_to: 0.75
        width: 0.18
      - name: charge chase
        type: chase
        start_ms: 150
        duration_ms: 850
        color: "#ffffff"
        intensity: 0.8
        speed: 2.0
        led_count: 3

  muzzle_flash:
    frame_duration_ms: 20
    duration_ms: 180
    mode: once
    layers:
      - name: white flash
        type: solid
        start_ms: 0
        duration_ms: 40
        color: "#ffffff"
        intensity: 1.0
      - name: orange fade
        type: solid
        start_ms: 40
        duration_ms: 140
        color: "#ff6600"
        intensity: 0.55

  charged_flash:
    frame_duration_ms: 20
    duration_ms: 500
    mode: once
    layers:
      - name: full white
        type: solid
        start_ms: 0
        duration_ms: 80
        color: "#ffffff"
        intensity: 1.0
      - name: sparkle falloff
        type: sparkle
        start_ms: 80
        duration_ms: 420
        color: "#00ccff"
        intensity: 0.9
        density: 0.35
        speed: 2.0
        seed: 42
