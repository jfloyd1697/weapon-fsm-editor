weapon:
  initial_state: ready
  clips:
    sound:
      path: assets/audio/memes/oh_my_god.wav
  light_sequences:
    sound_reactive:
      path: assets/lights/memes/oh_my_god.yaml
  states:
  - id: ready
    label: Ready
  transitions:
  - id: play_sound
    source: ready
    trigger: trigger_pressed
    target: ready
    internal: true
    actions:
    - type: play_audio
      clip: sound
      mode: once
      interrupt: interrupt_all
    - type: play_light
      sequence: sound_reactive
      mode: once
