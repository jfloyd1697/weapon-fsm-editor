    source: studs_00
    trigger: trigger_pressed
    target: studs_01
  - id: advance_01
    source: studs_01
    trigger: progress_tick
    guard:
      trigger_pressed: true
    target: studs_02
  - id: release_01
    source: studs_01
    trigger: trigger_released
    target: studs_00
    actions:
    - type: cancel_scheduled_events
      event: progress_tick
    - type: stop_audio
  - id: reset_01
    source: studs_01
    trigger: reload_pressed
    target: studs_00
    actions:
    - type: cancel_scheduled_events
