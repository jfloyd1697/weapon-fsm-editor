weapon:
  initial_state: studs_00
  variables:
    progress_interval_ms: 400
    completion_hold_ms: 1500
  clips:
    collect:
      path: assets/audio/true_jedi/lego_true_jedi_loop.wav
    complete:
      path: assets/audio/true_jedi/lego_true_jedi_end.wav
  light_sequences:
    stud_progress:
      path: assets/lights/true_jedi/stud_progress.yaml
  states:
  - id: studs_00
    label: STUDS 00/20
    on_entry:
    - type: play_light
      sequence: stud_progress
      value: 0
      mode: frame
  - id: studs_01
    label: STUDS 01/20
    on_entry:
    - type: play_light
      sequence: stud_progress
      value: 1
      mode: frame
    - type: play_audio
      clip: collect
    - type: schedule_event
      event: progress_tick
      delay_ms_from_var: progress_interval_ms
