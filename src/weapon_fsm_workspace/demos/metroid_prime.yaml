clips:
  charge_start: assets/audio/prime-arm-cannon/prime-charge-start.wav
  charge_loop: assets/audio/prime-arm-cannon/prime-charge-loop.wav
  normal_fire: assets/audio/prime-arm-cannon/prime-basic.wav
  charged_fire: assets/audio/prime-arm-cannon/prime-basic2.wav

weapon:
  initial_state: ready

  variables:
    charge_ticks: 0
    precharge_threshold: 10
    charge_threshold: 50


#  light_sequences:
#    charge_glow:
#      path: assets/lights/charge_glow.yaml
#    fully_charged:
#      path: assets/lights/fully_charged.yaml
#    muzzle_flash:
#      path: assets/lights/muzzle_flash.yaml
#    charged_flash:
#      path: assets/lights/charged_flash.yaml


  states:
    - id: ready
      label: Ready
      on_entry:
        - type: cancel_scheduled_events
          event: precharge_done
        - type: cancel_scheduled_events
          event: charge_tick

#        - type: stop_light_sequence

    - id: precharging
      label: Precharging
      on_entry:
        - type: schedule_event
          event: charge_tick
          delay_ms: 100
        - type: schedule_event
          event: precharge_done
          delay_ms: 100

    - id: charging
      label: Charging
      on_entry:
        - type: play_audio
          clip: charge_start
        - type: play_audio
          clip: charge_loop
          interrupt: interrupt_all
#        - type: start_light_sequence
#          sequence: charge_glow
        - type: schedule_event
          event: charge_tick
          delay_ms: 100

    - id: charged
      label: Charged
#      on_entry:
#        - type: stop_light_sequence
#        - type: start_light_sequence
#          sequence: fully_charged

    - id: normal_shot
      label: Normal Shot
      on_entry:
        - type: cancel_scheduled_events
          event: precharge_done
        - type: cancel_scheduled_events
          event: charge_tick
        - type: stop_audio
#        - type: stop_light_sequence
        - type: play_audio
          clip: normal_fire
          interrupt: interrupt_all
#        - type: start_light_sequence
#          sequence: muzzle_flash
        - type: set_var
          name: charge_ticks
          value: 0
        - type: schedule_event
          event: shot_done
          delay_ms: 10

    - id: charged_shot
      label: Charged Shot
      on_entry:
        - type: cancel_scheduled_events
          event: precharge_done
        - type: cancel_scheduled_events
          event: charge_tick
        - type: stop_audio
#        - type: stop_light_sequence
        - type: play_audio
          clip: charged_fire
          interrupt: interrupt_all
#        - type: start_light_sequence
#          sequence: charged_flash
        - type: set_var
          name: charge_ticks
          value: 0
        - type: schedule_event
          event: shot_done
          delay_ms: 180

  transitions:
    - id: start_precharge
      source: ready
      trigger: trigger_pressed
      target: precharging
      actions:
        - type: set_var
          name: charge_ticks
          value: 0

    - id: release_during_precharge
      source: precharging
      trigger: trigger_released
      target: normal_shot

    - id: precharge_to_charging
      source: precharging
      trigger: precharge_done
      guard:
        all:
          - trigger_pressed: true
          - var_gte:
              name: charge_ticks
              value_from_var: precharge_threshold
      target: charging

    - id: precharge_tick_continue
      source: precharging
      trigger: charge_tick
      guard:
        all:
          - trigger_pressed: true
          - var_lt:
              name: charge_ticks
              value_from_var: precharge_threshold
      target: precharging
      actions:
        - type: add_var
          name: charge_ticks
          value: 1
        - type: schedule_event
          event: charge_tick
          delay_ms: 10

    - id: charge_done
      source: charging
      trigger: charge_tick
      guard:
        all:
          - trigger_pressed: true
          - var_gte:
              name: charge_ticks
              value_from_var: charge_threshold
      target: charged
      actions:
        - type: schedule_event
          event: charge_tick
          delay_ms: 10

    - id: charge_tick_continue
      source: charging
      trigger: charge_tick
      guard:
        all:
          - trigger_pressed: true
          - var_lt:
              name: charge_ticks
              value_from_var: charge_threshold
      target: charging
      actions:
        - type: add_var
          name: charge_ticks
          value: 1
        - type: schedule_event
          event: charge_tick
          delay_ms: 10

    - id: charged_continue
      source: charged
      trigger: charge_tick
      guard:
        all:
          - trigger_pressed: true
          - var_lt:
              name: charge_ticks
              value_from_var: charge_threshold
      target: charged
      actions:
        - type: add_var
          name: charge_ticks
          value: 1
        - type: schedule_event
          event: charge_tick
          delay_ms: 10


    - id: release_early
      source: charging
      trigger: trigger_released
      guard:
        var_lt:
          name: charge_ticks
          value_from_var: charge_threshold
      target: normal_shot

    - id: release_charged
      source: charged
      trigger: trigger_released
      target: charged_shot

    - id: shot_done_normal_ready
      source: normal_shot
      trigger: shot_done
      target: ready

    - id: shot_done_charged_ready
      source: charged_shot
      trigger: shot_done
      target: ready
