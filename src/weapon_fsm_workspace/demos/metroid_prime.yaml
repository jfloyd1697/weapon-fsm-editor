clips:
  equip: assets/audio/prime-arm-cannon/prime-arm-cannon-equip.wav
  charge_start: assets/audio/prime-arm-cannon/prime-charge-start.wav
  charge_loop: assets/audio/prime-arm-cannon/prime-charge-loop.wav
  shot: assets/audio/prime-arm-cannon/prime-basic.wav

light_sequences:
  prime_charge_warm_build: assets/lights/metroid-prime-lights.yaml
  prime_charge_warm_hold: assets/lights/metroid-prime-lights.yaml
  prime_charge_warm_release: assets/lights/metroid-prime-lights.yaml
  prime_charge_warm_cooldown: assets/lights/metroid-prime-lights.yaml

weapon:
  initial_state: ready

  variables:
    trigger_hold_ticks: 0

    equip_done_ms: 500
    tick_interval_ms: 50

    burst_second_shot_tick: 2
    burst_third_shot_tick: 4

    charge_start_tick: 8
    charged_tick: 50

    charge_start_to_loop_delay_ms: 450
    charged_shot_done_ms: 180

  states:
    - id: ready
      label: Ready
      on_entry:
        - type: cancel_scheduled_events
          event: trigger_tick
        - type: cancel_scheduled_events
          event: charge_loop_start
        - type: set_var
          name: trigger_hold_ticks
          value: 0

    - id: equipping
      label: Equipping
      on_entry:
        - type: cancel_scheduled_events
          event: trigger_tick
        - type: cancel_scheduled_events
          event: charge_loop_start
        - type: stop_light
        - type: set_var
          name: trigger_hold_ticks
          value: 0
        - type: play_audio
          clip: equip
          mode: once
          interrupt: interrupt_all
        - type: schedule_event
          event: equip_done
          delay_ms_from_var: equip_done_ms

    - id: holding
      label: Holding Trigger
      on_entry:
        - type: play_audio
          clip: shot
          mode: once
          interrupt: overlap
        - type: schedule_event
          event: trigger_tick
          delay_ms_from_var: tick_interval_ms

    - id: charging
      label: Charging
      on_entry:
        - type: play_audio
          clip: charge_start
          mode: once
          interrupt: ignore
        - type: play_light
          sequence: prime_charge_warm_build
          mode: loop
          interrupt: interrupt
        - type: schedule_event
          event: charge_loop_start
          delay_ms_from_var: charge_start_to_loop_delay_ms
        - type: schedule_event
          event: trigger_tick
          delay_ms_from_var: tick_interval_ms

    - id: charged
      label: Charged
      on_entry:
        - type: play_light
          sequence: prime_charge_warm_hold
          mode: loop
          interrupt: interrupt
        - type: schedule_event
          event: trigger_tick
          delay_ms_from_var: tick_interval_ms

    - id: charged_shot
      label: Charged Shot
      on_entry:
        - type: cancel_scheduled_events
          event: trigger_tick
        - type: cancel_scheduled_events
          event: charge_loop_start
        - type: stop_audio
        - type: play_audio
          clip: shot
          mode: once
          interrupt: interrupt_all
        - type: play_light
          sequence: prime_charge_warm_release
          mode: once
          interrupt: interrupt
        - type: set_var
          name: trigger_hold_ticks
          value: 0
        - type: schedule_event
          event: shot_done
          delay_ms_from_var: charged_shot_done_ms

  transitions:
    - id: on_equip_start_equipping
      source: ready
      trigger: on_equip
      target: equipping

    - id: ignore_duplicate_on_equip_while_equipping
      source: equipping
      trigger: on_equip
      target: equipping
      internal: true

    - id: equip_done_ready
      source: equipping
      trigger: equip_done
      target: ready

    - id: trigger_press_start_cycle
      source: ready
      trigger: trigger_pressed
      target: holding
      actions:
        - type: cancel_scheduled_events
          event: trigger_tick
        - type: cancel_scheduled_events
          event: charge_loop_start
        - type: stop_light
        - type: set_var
          name: trigger_hold_ticks
          value: 1

    - id: release_before_charge
      source: holding
      trigger: trigger_released
      target: ready
      actions:
        - type: cancel_scheduled_events
          event: trigger_tick
        - type: cancel_scheduled_events
          event: charge_loop_start
        - type: stop_light
        - type: set_var
          name: trigger_hold_ticks
          value: 0

    - id: holding_second_burst_shot
      source: holding
      trigger: trigger_tick
      target: holding
      internal: true
      guard:
        var_eq:
          name: trigger_hold_ticks
          value_from_var: burst_second_shot_tick
      actions:
        - type: play_audio
          clip: shot
          mode: once
          interrupt: overlap
        - type: add_var
          name: trigger_hold_ticks
          value: 1
        - type: schedule_event
          event: trigger_tick
          delay_ms_from_var: tick_interval_ms

    - id: holding_third_burst_shot
      source: holding
      trigger: trigger_tick
      target: holding
      internal: true
      guard:
        var_eq:
          name: trigger_hold_ticks
          value_from_var: burst_third_shot_tick
      actions:
        - type: play_audio
          clip: shot
          mode: once
          interrupt: overlap
        - type: add_var
          name: trigger_hold_ticks
          value: 1
        - type: schedule_event
          event: trigger_tick
          delay_ms_from_var: tick_interval_ms

    - id: holding_begin_charge
      source: holding
      trigger: trigger_tick
      target: charging
      guard:
        var_gte:
          name: trigger_hold_ticks
          value_from_var: charge_start_tick

    - id: holding_tick_continue
      source: holding
      trigger: trigger_tick
      target: holding
      internal: true
      actions:
        - type: add_var
          name: trigger_hold_ticks
          value: 1
        - type: schedule_event
          event: trigger_tick
          delay_ms_from_var: tick_interval_ms

    - id: start_charge_loop
      source: charging
      trigger: charge_loop_start
      target: charging
      internal: true
      guard:
        var_gt:
          name: trigger_hold_ticks
          value: 0
      actions:
        - type: play_audio
          clip: charge_loop
          mode: loop
          interrupt: ignore

    - id: start_charge_loop_when_already_charged
      source: charged
      trigger: charge_loop_start
      target: charged
      internal: true
      guard:
        var_gt:
          name: trigger_hold_ticks
          value: 0
      actions:
        - type: play_audio
          clip: charge_loop
          mode: loop
          interrupt: ignore

    - id: charging_to_charged
      source: charging
      trigger: trigger_tick
      target: charged
      guard:
        var_gte:
          name: trigger_hold_ticks
          value_from_var: charged_tick

    - id: charging_tick_continue
      source: charging
      trigger: trigger_tick
      target: charging
      internal: true
      actions:
        - type: add_var
          name: trigger_hold_ticks
          value: 1
        - type: schedule_event
          event: trigger_tick
          delay_ms_from_var: tick_interval_ms

    - id: release_after_charge_started
      source: charging
      trigger: trigger_released
      target: charged_shot
      actions:
        - type: cancel_scheduled_events
          event: trigger_tick
        - type: cancel_scheduled_events
          event: charge_loop_start

    - id: charged_tick_continue
      source: charged
      trigger: trigger_tick
      target: charged
      internal: true
      actions:
        - type: add_var
          name: trigger_hold_ticks
          value: 1
        - type: schedule_event
          event: trigger_tick
          delay_ms_from_var: tick_interval_ms

    - id: release_charged
      source: charged
      trigger: trigger_released
      target: charged_shot
      actions:
        - type: cancel_scheduled_events
          event: trigger_tick
        - type: cancel_scheduled_events
          event: charge_loop_start

    - id: shot_done_charged_ready
      source: charged_shot
      trigger: shot_done
      target: ready
      actions:
        - type: play_light
          sequence: prime_charge_warm_cooldown
          mode: once
          interrupt: interrupt