weapon:
  initial_state: idle

  clips:
    idle_loop:
      path: assets/audio/chainsaw/idle_loop.wav
    rev_start:
      path: assets/audio/chainsaw/rev_start.wav
    rev_loop:
      path: assets/audio/chainsaw/rev_loop.wav
    rev_stop:
      path: assets/audio/chainsaw/rev_stop.wav

  light_sequences:
    idle_glow:
      path: assets/lights/idle_glow.yaml

  states:
    - id: idle
      label: Idle
      on_entry:
        - type: play_audio
          clip: idle_loop
          mode: loop
          interrupt: schedule
        - type: start_light_sequence
          sequence: idle_glow

    - id: rev_up
      label: Rev
      on_entry:
        - type: stop_audio
        - type: stop_light_sequence

    - id: active
      label: Active
      on_entry:
        - type: stop_audio
        - type: play_audio
          clip: rev_loop
          mode: loop
          interrupt: ignore

  transitions:
    - id: start_saw
      source: idle
      trigger: on_equip
      target: idle

    - id: rev
      source: idle
      trigger: trigger_pressed
      target: active

    - id: release
      source: active
      trigger: trigger_released
      target: idle
      actions:
        - type: stop_audio
        - type: play_audio
          clip: rev_stop
          interrupt: schedule